[package]
name = "pixel-forge"
version = "0.3.0"
description = "A local pixel art and motion workshop"
authors = ["Pixel Forge contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "pixel_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
